name: Release

# 手动运行（Actions → Release → Run workflow，或 `gh workflow run release.yml --ref master`）。
# 版本取自所选分支 gradle.properties 的 appVersionName；tag 在 APK 上传完、Release 公开的那一刻
# 才由 GitHub 创建，所以构建期间和构建失败时都不会出现指向不存在 Release 的 tag。
# 需要四个仓库 secret：ANDROID_KEYSTORE_BASE64（.jks 的 base64）、ANDROID_KEYSTORE_PASSWORD、
# ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Never replace an already published version: people have installed that APK.
      - name: Resolve version and refuse an existing tag or release
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -n 's/^appVersionName=//p' gradle.properties)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::appVersionName in gradle.properties is '${VERSION}', expected 1.2.3 or 1.2.3-beta.1."
            exit 1
          fi
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "::error::Tag ${TAG} already exists. Bump appVersionName in gradle.properties before releasing."
            exit 1
          fi
          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq ".[] | select(.tag_name == \"${TAG}\") | .id")
          if [ -n "$EXISTING" ]; then
            echo "::error::A release or draft for ${TAG} already exists (id ${EXISTING}). Review it before releasing again."
            exit 1
          fi
          # v0.* 与带预发布后缀（如 1.0.0-beta.1）的版本标为 Pre-release。
          if [[ "$TAG" == v0.* || "$VERSION" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG} (prerelease=${PRERELEASE}) from ${GITHUB_SHA}"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 没有签名的 APK 装不上，也无法覆盖升级，所以缺任何一项都直接失败。
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret ANDROID_${name} is not set."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Rust for Android
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build the signed APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ./gradlew :app:assembleRelease
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/LyricsAdapter-${VERSION}-android.apk"

      # An APK that came out unsigned, or carrying another version, must not reach the release.
      - name: Verify the signature and version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          APK="release/LyricsAdapter-${VERSION}-android.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -E 'Signer #1 certificate (DN|SHA-256)'
          BUILT=$("$BUILD_TOOLS/aapt2" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          if [ "$BUILT" != "$VERSION" ]; then
            echo "::error::The APK reports version '${BUILT}', expected '${VERSION}'."
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          if-no-files-found: error
          path: release/*.apk

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the APK
        uses: actions/download-artifact@v8
        with:
          name: release-android
          path: release/

      - name: List release files
        run: ls -la release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          # The build took minutes; refuse if the tag appeared meanwhile.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "::error::Tag ${TAG} was created while this release was building."
            exit 1
          fi
          shopt -s nullglob
          FILES=(release/*.apk)
          test "${#FILES[@]}" -gt 0
          echo "Uploading: ${FILES[*]}"
          if [ "$PRERELEASE" = true ]; then PRE="--prerelease"; else PRE=""; fi
          # Keep the release a draft until the APK has uploaded.
          # A draft does not create its tag; publishing it tags the built commit.
          gh release create "$TAG" "${FILES[@]}" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            $PRE
          # Drafts have no tag yet, so look the draft up by id rather than by tag name.
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"${TAG}\") | .id")
          test -n "$RELEASE_ID"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false > /dev/null
          echo "Published ${TAG} at ${GITHUB_SHA}"
